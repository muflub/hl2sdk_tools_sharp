name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  # Run by hand with capture on to record a CPU's delta files from this
  # port's own output (see src/SourceSharp.Tests/Fixtures/rsqrt-vendor). The
  # files come back as the rsqrt-vendor-* artifacts, to be reviewed and
  # committed; nothing is committed by the run.
  workflow_dispatch:
    inputs:
      capture:
        description: Record vendor goldens (SS_CAPTURE_VENDOR_GOLDENS=1)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel is x86 (Intel); macos-latest is Apple Silicon (arm64).
        #
        # KEEP macos-15-intel even though osx-x64 is no longer packaged: it is
        # the only Intel CPU in this matrix (the ubuntu and windows runners are
        # AMD EPYC). Under -compliance stock, results built on rcpss/rsqrtss
        # estimates differ in the last bits between AMD and Intel, and the
        # facts check Intel's against Fixtures/rsqrt-vendor/GenuineIntel.
        # Without this runner those expected values are never exercised, and
        # the capture run below could not re-record them.
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The stock-parity facts that depend on a hardware reciprocal estimate
      # take their expected values by CPU vendor, or Arm64 (see
      # VendorGolden.cs), so the log says which one this runner is.
      - name: CPU
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)   lscpu | grep -E 'Vendor ID|Model name' ;;
            macOS)   sysctl -n machdep.cpu.brand_string ;;
            Windows) powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name" ;;
          esac

      # The facts for the Python tools (compile-perf, content bundling). The
      # tools are POSIX-only (they wait4, signal process groups and read
      # /proc), and Linux is the platform that decides, so this runner runs
      # them. They need nothing built, so they go first and fail fast.
      - name: Python tool tests
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s tools/tests -v

      - name: Restore
        run: dotnet restore src/SourceSharp.MapTools.slnx

      - name: Build
        run: dotnet build src/SourceSharp.MapTools.slnx -c Release --no-restore

      - name: Test
        env:
          SS_CAPTURE_VENDOR_GOLDENS: ${{ inputs.capture && '1' || '' }}
        run: >-
          dotnet test src/SourceSharp.MapTools.slnx -c Release --no-build
          --logger "trx;LogFileName=results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults

      - name: Upload captured vendor goldens
        if: always() && inputs.capture
        uses: actions/upload-artifact@v7
        with:
          name: rsqrt-vendor-${{ matrix.os }}
          path: src/SourceSharp.Tests/Fixtures/rsqrt-vendor

  # ssmap in two postures per platform: a native AOT executable (no .NET
  # needed, GPU package linked in) and a framework-dependent dll build (needs
  # the .NET 10 runtime; the GPU package is staged beside it, where ssmap
  # looks for it by name). Built on every run so a PR proves both still
  # publish; attached to the release only on a tag.
  package:
    name: package (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: win-x64, os: windows-latest }
          - { rid: osx-arm64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Not VERSION: MSBuild reads environment variables as properties, and a
      # commit hash as $(Version) makes every restore fail without an error.
      - name: Label
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then v="$GITHUB_REF_NAME"; else v="${GITHUB_SHA::7}"; fi
          echo "SSMAP_LABEL=$v" >> "$GITHUB_ENV"

      - name: Publish native AOT
        run: >-
          dotnet publish src/SourceSharp.MapCompile -c Release -r ${{ matrix.rid }}
          -p:PublishAot=true -o out/aot

      - name: Publish framework-dependent
        run: |
          dotnet publish src/SourceSharp.MapCompile -c Release -r ${{ matrix.rid }} --self-contained false -o out/dll
          dotnet publish src/SourceSharp.MapTools.Gpu -c Release -r ${{ matrix.rid }} --self-contained false -o out/dll

      - name: Archive
        run: |
          mkdir -p dist
          for kind in aot dll; do
            find out/$kind \( -name '*.xml' -o -name '*.pdb' -o -name '*.dbg' -o -name '*.dSYM' \) -prune -exec rm -rf {} +
            name="ssmap-$SSMAP_LABEL-${{ matrix.rid }}-$kind"
            if [[ "$RUNNER_OS" == Windows ]]; then
              (cd out/$kind && 7z a -tzip "../../dist/$name.zip" . > /dev/null)
            else
              tar -C out/$kind -czf "dist/$name.tar.gz" .
            fi
          done
          ls -la dist

      # Every rid is built on a runner of its own architecture, so both
      # builds can be run here. There is no osx-x64 package; Intel Macs are
      # still tested (see the test job's matrix for why that runner stays).
      - name: Smoke
        run: |
          ./out/aot/ssmap --help | sed -n 1p
          ./out/dll/ssmap --help | sed -n 1p

      # The AOT executable ships, so it must write the same bytes the JIT
      # build writes. The two do not run the same machine code: NativeAOT
      # targets a baseline CPU while the JIT uses what this one has (AVX2,
      # AVX-512), so the Vector256/Vector<T> branches take different paths,
      # and a lane rule that differs between them shows here as a cmp
      # failure. Both builds compile the sandbox map, which exercises every
      # feature, through the whole chain at the default thread count, against
      # a copy of mod_sharp with its Steam paths removed and the generated
      # stand-in content added (README, "Without the Steam content"), so no
      # Steam install is needed. Full vbsp and vvis; vrad with -fast (and the
      # default bounces) to keep the step short: -fast changes how much light
      # work runs, not which code paths do (about 90 s a build on a loaded
      # 4-core machine). Every rid runs it, on a runner of its own
      # architecture, so x64 and arm64 are both checked. The inputs are
      # copied out of game/ and maps/, which stay untouched; each build
      # compiles its own copy of the map in out/aot-jit/<kind>/, so neither
      # writes into the other's folder. Paths are relative so Windows' bash
      # and ssmap read them the same way.
      - name: AOT and JIT write the same bytes
        run: |
          dotnet build tools/SyntheticContent/SyntheticContent.csproj -c Release
          work=out/aot-jit
          rm -rf "$work"
          mkdir -p "$work"
          cp -R game/mod_sharp "$work/game"
          grep -v '|appid_' game/mod_sharp/gameinfo.txt > "$work/game/gameinfo.txt"
          dotnet tools/SyntheticContent/bin/Release/net10.0/SyntheticContent.dll --content "$work/game"
          for kind in aot dll; do
            mkdir -p "$work/$kind"
            cp maps/ss_sandbox.vmf "$work/$kind/"
            start=$SECONDS
            if ! ./out/$kind/ssmap all "$work/$kind/ss_sandbox.vmf" -game "$work/game" --vrad -fast \
                > "$work/$kind.log" 2>&1; then
              cat "$work/$kind.log"
              echo "::error::the $kind build failed to compile ss_sandbox"
              exit 1
            fi
            echo "$kind: $((SECONDS - start)) s"
          done
          status=0
          for ext in bsp prt lin; do
            a="$work/aot/ss_sandbox.$ext" d="$work/dll/ss_sandbox.$ext"
            if [[ ! -e "$a" && ! -e "$d" ]]; then continue; fi
            if cmp "$a" "$d"; then
              echo "ss_sandbox.$ext: identical ($(wc -c < "$a") bytes)"
            else
              echo "::error::ss_sandbox.$ext differs between the AOT and JIT builds"
              status=1
            fi
          done
          # The .bsp must have been written, or there was nothing to compare.
          [[ -s "$work/aot/ss_sandbox.bsp" ]] || { echo "::error::no ss_sandbox.bsp was written"; exit 1; }
          exit $status

      - uses: actions/upload-artifact@v7
        with:
          name: ssmap-${{ matrix.rid }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: ssmap-*
          path: dist
          merge-multiple: true

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la dist
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
