# generated by ssmap layout: seed 2, 3 rows x 3 columns, 0 empty cell(s)
# the grid's first line is the north row; each line runs west to east
library: ../rooms.vmf
rows: 3
columns: 3
up_map: transit_01
down_map: transit_03
grid:
  - [cross@180,     cross@90, tee@90]
  - [hall@90,       corner,   lift_up@180]
  - [lift_down@270, hall,     tee@90]
