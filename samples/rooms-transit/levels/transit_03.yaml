# generated by ssmap layout: seed 3, 3 rows x 3 columns, 0 empty cell(s)
# the grid's first line is the north row; each line runs west to east
library: ../rooms.vmf
rows: 3
columns: 3
down: none
up_map: transit_02
grid:
  - [tee@270,   lift_up@270, corner@180]
  - [cross@270, cross@270,   cross]
  - [tee@270,   corner@90,   corner]
