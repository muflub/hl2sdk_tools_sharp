# generated by ssmap layout: seed 1, 3 rows x 3 columns, 0 empty cell(s)
# the grid's first line is the north row; each line runs west to east
library: ../rooms.vmf
rows: 3
columns: 3
up: none
down_map: transit_02
grid:
  - [tee,     cross,     lift_down]
  - [tee@180, cross@270, cross]
  - [tee@90,  end@90,    hall@90]
