# generated by ssmap layout: seed 2, 4 rows x 4 columns, 0 empty cell(s), large share 0.4, groups of 3
# the grid's first line is the north row; each line runs west to east
libraries:
  base: ../base.vmf
  caves: ../caves.vmf
rows: 4
columns: 4
grid:
  - [cross@270,  cross@90,   tee@90,     caves.end@270]
  - [tee@270,    cross@270,  cavern,     corner@90]
  - [cavern@270, cross@270,  cavern@270, gallery@180]
  - [cavern@270, cavern@180, tee,        base.hall@180]
