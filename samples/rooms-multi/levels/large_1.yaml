# generated by ssmap layout: seed 1, 4 rows x 4 columns, 0 empty cell(s), large share 0.4, groups of 3
# the grid's first line is the north row; each line runs west to east
libraries:
  base: ../base.vmf
  caves: ../caves.vmf
rows: 4
columns: 4
grid:
  - [cross@180,   cross@180,     cross@270,     tee@180]
  - [gallery@90,  corner,        tee@90,        gallery@90]
  - [gallery@90,  corner@270,    tee@90,        gallery@270]
  - [gallery@270, base.hall@270, caves.hall@90, gallery@270]
